<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RYDO Driver</title>

  <link rel="stylesheet" href="driver.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <!-- LOGIN -->
  <section id="loginScreen" class="auth-screen">
    <div class="auth-card">
      <div class="logo">RYDO</div>
      <p class="tagline">Driver Portal</p>

      <h1>Welcome Back</h1>
      <p class="subtext">Login to start driving with RYDO.</p>

      <form id="driverLoginForm">
        <input
          type="email"
          id="loginEmail"
          placeholder="Email address"
          required
        >

        <div class="password-box">
          <input
            type="password"
            id="loginPassword"
            placeholder="Password"
            required
          >
          <button type="button" id="toggleLoginPassword">Show</button>
        </div>

        <button type="button" id="forgotPasswordBtn" class="link-btn">
          Forgot Password?
        </button>

        <button type="submit" class="main-btn">
          Login
        </button>
      </form>

      <p id="loginMessage" class="message"></p>

      <div class="switch-auth">
        New driver?
        <button type="button" id="showRegistrationBtn">
          Register Now
        </button>
      </div>
    </div>
  </section>


  <!-- REGISTRATION -->
  <section id="registrationScreen" class="auth-screen hidden">
    <div class="auth-card">

      <div class="logo">RYDO</div>
      <p class="tagline">Driver Registration</p>

      <h1>Become a Driver</h1>
      <p class="subtext">
        Submit your details for verification.
      </p>

      <form id="driverRegistrationForm">

        <input
          type="text"
          id="registerFullName"
          placeholder="Full name"
          required
        >

        <input
          type="email"
          id="registerEmail"
          placeholder="Email address"
          required
        >

        <input
          type="tel"
          id="registerPhone"
          placeholder="Phone number"
          required
        >

        <div class="password-box">
          <input
            type="password"
            id="registerPassword"
            placeholder="Create password"
            required
            minlength="6"
          >
          <button type="button" id="toggleRegisterPassword">Show</button>
        </div>

        <label>Driver License</label>
        <input type="file" id="driverLicense" accept="image/*,.pdf" required>

        <label>Citizenship / Government ID</label>
        <input type="file" id="driverCitizenship" accept="image/*,.pdf" required>

        <label>Driver Photo</label>
        <input type="file" id="driverPhoto" accept="image/*" required>

        <select id="vehicleType" required>
          <option value="">Select vehicle</option>
          <option value="bike">Bike</option>
          <option value="car">Car</option>
          <option value="tuk_tuk">Tuk Tuk</option>
        </select>

        <input
          type="text"
          id="vehicleNumber"
          placeholder="Vehicle number"
          required
        >

        <input
          type="text"
          id="vehicleModel"
          placeholder="Vehicle model"
          required
        >

        <label>Vehicle Registration Document</label>
        <input type="file" id="vehicleDocument" accept="image/*,.pdf" required>

        <button type="submit" class="main-btn">
          Submit for Verification
        </button>

      </form>

      <p id="registrationMessage" class="message"></p>

      <div class="switch-auth">
        Already registered?
        <button type="button" id="backToLoginBtn">
          Back to Login
        </button>
      </div>

      <p class="verification-note">
        Your account must be verified before you can go online and accept rides.
      </p>

    </div>
  </section>

  <script src="driver-auth.js"></script>
</body>
    </html>
