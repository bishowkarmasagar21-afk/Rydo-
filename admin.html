
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rydo Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#08111b;color:#f5f7fa;font:16px Arial}
header{padding:20px;background:#111e2c;border-bottom:2px solid #ff781f}
h1 span{color:#ff781f}.wrap{max-width:900px;margin:30px auto;padding:15px}
.card{background:#111e2c;border:1px solid #29394a;border-radius:12px;padding:22px;margin-bottom:18px}
.login{max-width:430px;margin:35px auto}label{display:block;margin:14px 0 7px}
input{width:100%;padding:12px;border-radius:7px;border:1px solid #ff781f;background:white;color:#111;font-size:16px}
button{padding:11px 15px;border:0;border-radius:7px;background:#ff781f;color:#151515;font-weight:bold;cursor:pointer;margin:8px 5px 0 0}
.secondary{background:#29394a;color:white}.msg{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:14px;color:#ffb6a5}
.hidden{display:none!important}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:#08111b;padding:17px;border-radius:9px}.stat b{font-size:25px;display:block;margin-bottom:6px}
.item{border-top:1px solid #29394a;padding:14px 0;overflow-wrap:anywhere}.muted{color:#a8b5c5;font-size:13px}
</style>
</head>
<body>
<header><h1><span>Ry</span>do Admin</h1></header>
<div class="wrap">
<section id="login" class="card login">
<h2>Administrator login</h2>
<form id="loginForm">
<label>Email</label><input id="email" type="email" autocomplete="username" required>
<label>Password</label><input id="password" type="password" autocomplete="current-password" required>
<button id="loginBtn" type="submit">Log in</button>
<button id="forgotBtn" class="secondary" type="button">Forgot password</button>
</form>
<div id="loginMsg" class="msg" role="status"></div>
</section>

<section id="dashboard" class="hidden">
<div class="card">
<button id="refreshBtn">Refresh data</button>
<button id="logoutBtn" class="secondary">Log out</button>
<div id="dashMsg" class="msg"></div>
<h2>Dashboard</h2>
<div class="stats">
<div class="stat"><b id="ridesCount">—</b>Rides loaded</div>
<div class="stat"><b id="driversCount">—</b>Drivers loaded</div>
<div class="stat"><b id="passengersCount">—</b>Passengers loaded</div>
<div class="stat"><b id="revenue">—</b>Completed fares</div>
</div>
</div>
<div class="card"><h2>Drivers</h2><div id="drivers">Not loaded.</div></div>
<div class="card"><h2>Passengers</h2><div id="passengers">Not loaded.</div></div>
<div class="card"><h2>Rides</h2><div id="rides">Not loaded.</div></div>
<div class="card"><h2>Fare rules</h2><div id="fares">Not loaded.</div></div>
</section>
</div>

<script>
"use strict";
const SUPABASE_URL="https://kqtvuorasqyzjbnlkkxs.supabase.co";
const SUPABASE_KEY="sb_publishable_zZFJiy0YWZgOXFesVuAQcA_wd7rleMb";
const $=id=>document.getElementById(id);
let db=null,admin=null,loading=false;

function msg(id,text){$(id).textContent=text||""}
function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function showLogin(text=""){ $("login").classList.remove("hidden");$("dashboard").classList.add("hidden");msg("loginMsg",text)}
function money(v){return "Rs. "+(Number(v)||0).toLocaleString("en-IN")}
function errorText(e){return e?.message||String(e)}
function hideLogin(){ $("login").classList.add("hidden");$("dashboard").classList.remove("hidden")}

if(window.supabase?.createClient){
  db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
}else{
  showLogin("Supabase library did not load. Check your internet and reload.");
}

async function verifyAdmin(user){
  const {data,error}=await db.from("profiles")
    .select("id,full_name,role").eq("id",user.id).maybeSingle();
  if(error)throw Error("Could not check profiles: "+error.message);
  if(!data)throw Error("No profiles row exists for this account.");
  if(String(data.role).toLowerCase()!=="admin")
    throw Error("Login succeeded, but this account is not an admin (profiles.role must be admin).");
  return data;
}

$("loginForm").addEventListener("submit",async e=>{
  e.preventDefault();
  if(!db)return showLogin("Supabase library is unavailable.");
  if(loading)return;
  loading=true;$("loginBtn").disabled=true;$("loginBtn").textContent="Signing in…";
  msg("loginMsg","Checking login…");
  try{
    const email=$("email").value.trim(),password=$("password").value;
    const {data,error}=await db.auth.signInWithPassword({email,password});
    if(error)throw error;
    if(!data.user)throw Error("Supabase did not return a user.");
    admin=await verifyAdmin(data.user);
    hideLogin();
    await loadDashboard();
  }catch(e){
    if(db)await db.auth.signOut().catch(()=>{});
    admin=null;showLogin(errorText(e));
  }finally{
    loading=false;$("loginBtn").disabled=false;$("loginBtn").textContent="Log in";
  }
});

$("forgotBtn").addEventListener("click",async()=>{
  const email=$("email").value.trim();
  if(!email)return msg("loginMsg","Enter your email address first.");
  $("forgotBtn").disabled=true;
  try{
    const redirectTo=location.origin+location.pathname;
    const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo});
    if(error)throw error;
    msg("loginMsg","If the account exists, a reset email has been requested. Check your inbox and spam folder.");
  }catch(e){msg("loginMsg",errorText(e))}
  finally{$("forgotBtn").disabled=false}
});

async function loadDashboard(){
  if(!admin)return;
  msg("dashMsg","Loading data…");
  const errors=[];
  const r=await db.from("rides").select("*").order("created_at",{ascending:false}).limit(300);
  const p=await db.from("profiles").select("id,full_name,phone,role,is_verified,is_online,created_at").order("created_at",{ascending:false}).limit(300);
  const f=await db.from("fare_rules").select("vehicle_type,base_fare,per_km_fare,platform_commission_percent,is_active").order("vehicle_type");
  if(r.error)errors.push("Rides: "+r.error.message);
  if(p.error)errors.push("Profiles: "+p.error.message);
  if(f.error)errors.push("Fare rules: "+f.error.message);
  const rides=r.data||[],profiles=p.data||[],fares=f.data||[];
  $("ridesCount").textContent=r.error?"Error":rides.length;
  $("driversCount").textContent=p.error?"Error":profiles.filter(x=>x.role==="driver").length;
  $("passengersCount").textContent=p.error?"Error":profiles.filter(x=>x.role==="passenger").length;
  $("revenue").textContent=r.error?"Error":money(rides.filter(x=>x.status==="completed").reduce((s,x)=>s+Number(x.fare||0),0));

  $("drivers").innerHTML=p.error?escapeHtml(p.error.message):profiles.filter(x=>x.role==="driver").map(d=>
    `<div class="item"><b>${escapeHtml(d.full_name||"Driver")}</b>
    <p>${escapeHtml(d.phone||"No phone")} · ${d.is_verified?"Verified":"Pending"} · ${d.is_online?"Online":"Offline"}</p>
    ${d.is_verified?"":`<button data-approve="${escapeHtml(d.id)}">Approve</button>`}</div>`
  ).join("")||"No driver records returned.";

  $("passengers").innerHTML=p.error?escapeHtml(p.error.message):profiles.filter(x=>x.role==="passenger").map(d=>
    `<div class="item"><b>${escapeHtml(d.full_name||"Passenger")}</b><p>${escapeHtml(d.phone||"No phone")}</p></div>`
  ).join("")||"No passenger records returned.";

  $("rides").innerHTML=r.error?escapeHtml(r.error.message):rides.map(x=>
    `<div class="item"><b>${escapeHtml(x.status||"Unknown")} · ${money(x.fare)}</b>
    <p>${escapeHtml(x.pickup||x.pickup_location||"Pickup not recorded")} → ${escapeHtml(x.destination||x.destination_location||"Destination not recorded")}</p>
    <div class="muted">${escapeHtml(x.vehicle_type||"")} · ${escapeHtml(x.payment_method||"")}</div></div>`
  ).join("")||"No ride records returned.";

  $("fares").innerHTML=f.error?escapeHtml(f.error.message):fares.map(x=>
    `<div class="item"><b>${escapeHtml(x.vehicle_type)}</b>
    <p>Base: ${money(x.base_fare)} · Per km: ${money(x.per_km_fare)} · Commission: ${Number(x.platform_commission_percent)||0}% · ${x.is_active?"Active":"Inactive"}</p></div>`
  ).join("")||"No fare rules returned.";

  $("drivers").querySelectorAll("[data-approve]").forEach(b=>b.addEventListener("click",async()=>{
    if(!confirm("Approve this driver after checking their documents?"))return;
    b.disabled=true;
    const {error}=await db.from("profiles").update({is_verified:true})
      .eq("id",b.dataset.approve).eq("role","driver");
    if(error)msg("dashMsg","Approval failed: "+error.message);
    else msg("dashMsg","Driver approval saved.");
    await loadDashboard();
  }));
  msg("dashMsg",errors.length?errors.join("\n"):"Dashboard data loaded.");
}

$("refreshBtn").addEventListener("click",()=>loadDashboard().catch(e=>msg("dashMsg",errorText(e))));
$("logoutBtn").addEventListener("click",async()=>{
  const {error}=await db.auth.signOut();
  admin=null;
  showLogin(error?"Logout error: "+error.message:"Logged out.");
});

async function init(){
  if(!db)return;
  try{
    const {data,error}=await db.auth.getSession();
    if(error)throw error;
    if(data.session?.user){
      admin=await verifyAdmin(data.session.user);
      hideLogin();
      await loadDashboard();
    }
  }catch(e){
    admin=null;
    showLogin("Session/admin check: "+errorText(e));
  }
}
init();
</script>
</body>
</html>
