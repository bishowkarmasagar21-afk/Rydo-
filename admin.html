<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RYDO Admin</title>
<link rel="stylesheet" href="admin.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<div id="adminLogin" class="auth">
  <div class="box">
    <div class="logo"><b>R</b>YDO</div>
    <h1>Admin Panel</h1>
    <p>Secure administrator login</p>

    <form id="adminLoginForm">
      <input id="adminEmail" type="email"
             placeholder="Admin email" required>

      <input id="adminPassword" type="password"
             placeholder="Password" required>

      <button id="adminLoginBtn" type="submit">Login</button>

      <div id="adminMessage"></div>
    </form>
  </div>
</div>

<div id="adminApp" style="display:none">

  <header class="top">
    <div class="logo"><b>R</b>YDO</div>
    <button id="logoutBtn">Logout</button>
  </header>

  <main>

    <section class="welcome">
      <h1>RYDO Admin Dashboard</h1>
      <p>Manage your Rydo platform.</p>
    </section>

    <section class="stats">
      <div><b id="totalPassengers">0</b><span>Passengers</span></div>
      <div><b id="totalDrivers">0</b><span>Drivers</span></div>
      <div><b id="totalRides">0</b><span>Rides</span></div>
      <div><b id="totalRevenue">Rs 0</b><span>Revenue</span></div>
    </section>

    <nav class="nav">
      <button data-panel="drivers">Drivers</button>
      <button data-panel="passengers">Passengers</button>
      <button data-panel="rides">Rides</button>
      <button data-panel="fares">Fares</button>
      <button data-panel="payments">Payments</button>
      <button data-panel="settings">Settings</button>
    </nav>

    <section id="drivers" class="panel">
      <h2>Driver Verification</h2>
      <div id="driverList">Loading...</div>
    </section>

    <section id="passengers" class="panel">
      <h2>Passengers</h2>
      <div id="passengerList">Loading...</div>
    </section>

    <section id="rides" class="panel">
      <h2>Rides</h2>
      <div id="rideList">Loading...</div>
    </section>

    <section id="fares" class="panel">
      <h2>Fare Rules</h2>
      <div id="fareList">Loading...</div>
    </section>

    <section id="payments" class="panel">
      <h2>Payments</h2>
      <div id="paymentList">Loading...</div>
    </section>

    <section id="settings" class="panel">
      <h2>Admin Settings</h2>
      <button id="changePasswordBtn">Change Password</button>
    </section>

  </main>
</div>

<script src="./admin-auth.js"></script>
<script src="./admin-dashboard.js"></script>
<script src="./admin-drivers.js"></script>
<script src="./admin-passengers.js"></script>
<script src="./admin-rides.js"></script>
<script src="./admin-fares.js"></script>
<script src="./admin-payments.js"></script>
<script src="./admin-settings.js"></script>

<script>
document.querySelectorAll("[data-panel]").forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll(".panel").forEach(p=>p.style.display="none");
    document.getElementById(btn.dataset.panel).style.display="block";
  };
});

document.getElementById("logoutBtn")?.addEventListener("click",async()=>{
  if(window.supabaseClient){
    await window.supabaseClient.auth.signOut();
  }
  location.reload();
});
</script>

</body>
</html>
