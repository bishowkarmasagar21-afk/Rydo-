<!DOCTYPE html>
<html>
<head>
  <title>Schema Inspection Tool</title>
</head>
<body>
  <h1>Supabase Schema Inspection</h1>
  <pre id="output"></pre>
  <script>
    const SUPABASE_URL = 'https://kqtvuorasqyzjbnlkkxs.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_zZFJiy0YWZgOXFesVuAQcA_wd7rleMb';
    
    async function inspectSchema() {
      const output = document.getElementById('output');
      
      try {
        output.textContent = 'Fetching tables...\n';
        
        // Try to fetch information_schema.tables
        const tablesResp = await fetch(`${SUPABASE_URL}/rest/v1/information_schema.tables?table_schema=eq.public`, {
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`
          }
        });
        
        if (!tablesResp.ok) {
          output.textContent += `Tables query failed: ${tablesResp.status} ${tablesResp.statusText}\n`;
          
          // Try alternative: fetch information_schema_columns view
          output.textContent += '\nTrying information_schema.columns...\n';
          const colResp = await fetch(`${SUPABASE_URL}/rest/v1/information_schema.columns?table_schema=eq.public`, {
            headers: {
              'apikey': SUPABASE_KEY,
              'Authorization': `Bearer ${SUPABASE_KEY}`
            }
          });
          
          if (colResp.ok) {
            const cols = await colResp.json();
            output.textContent += JSON.stringify(cols, null, 2);
          } else {
            output.textContent += `Columns query also failed: ${colResp.status}\n`;
            output.textContent += 'Attempting to list common table names...\n';
            
            // Try known table names
            const tableNames = ['rides', 'passengers', 'drivers', 'fare_config', 'vehicles', 'users', 'auth_users'];
            for (const name of tableNames) {
              try {
                const resp = await fetch(`${SUPABASE_URL}/rest/v1/${name}?limit=1`, {
                  headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': `Bearer ${SUPABASE_KEY}`
                  }
                });
                if (resp.ok) {
                  output.textContent += `✓ Table exists: ${name}\n`;
                  const sample = await resp.json();
                  if (sample.length > 0) {
                    output.textContent += `  Columns: ${Object.keys(sample[0]).join(', ')}\n`;
                  }
                } else if (resp.status === 404) {
                  output.textContent += `✗ Table not found: ${name}\n`;
                }
              } catch (e) {
                output.textContent += `? Error checking ${name}: ${e.message}\n`;
              }
            }
          }
        } else {
          const tables = await tablesResp.json();
          output.textContent += `Found ${tables.length} tables:\n`;
          tables.forEach(t => {
            output.textContent += `  - ${t.table_name}\n`;
          });
          
          // Get columns for each table
          output.textContent += '\n\nFetching columns...\n';
          for (const table of tables) {
            try {
              const colResp = await fetch(`${SUPABASE_URL}/rest/v1/information_schema.columns?table_name=eq.${table.table_name}`, {
                headers: {
                  'apikey': SUPABASE_KEY,
                  'Authorization': `Bearer ${SUPABASE_KEY}`
                }
              });
              if (colResp.ok) {
                const cols = await colResp.json();
                output.textContent += `\n${table.table_name}:\n`;
                cols.forEach(c => {
                  output.textContent += `  - ${c.column_name} (${c.data_type})\n`;
                });
              }
            } catch (e) {
              output.textContent += `Error fetching columns for ${table.table_name}: ${e.message}\n`;
            }
          }
        }
      } catch (error) {
        output.textContent = `Error: ${error.message}\n${error.stack}`;
      }
    }
    
    inspectSchema();
  </script>
</body>
</html>
