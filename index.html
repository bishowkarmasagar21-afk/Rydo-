<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RYDO — Passenger</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#08111b;--panel:#101d29;--card:#142638;--line:#22384a;--text:#f5f8fb;--muted:#91a2b2;--orange:#ff7417;--green:#19c37d;--red:#ff5366}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#07111b,#0d1a25);color:var(--text);font:15px Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}
.app{max-width:520px;margin:auto;min-height:100vh;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.logo{font-size:25px;font-weight:900;letter-spacing:2px}.logo b{color:var(--orange)}.user{color:var(--muted);font-size:12px}
.screen{display:none}.screen.active{display:block}.box{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px}.title{font-size:27px;font-weight:800;margin:4px 0 7px}.sub{color:var(--muted);line-height:1.5}.tabs{display:flex;gap:8px;margin-bottom:15px}.tab{flex:1;padding:12px;border:1px solid var(--line);background:#0c1822;color:var(--muted);border-radius:12px}.tab.active{background:#2a1a10;color:#fff;border-color:#a64b17}.field{margin:10px 0}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.field input{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:#0b1721;color:#fff;outline:none}.primary{width:100%;padding:15px;border:0;border-radius:13px;background:linear-gradient(135deg,#ff7417,#ff963d);color:#fff;font-weight:800;margin-top:8px}.ghost{width:100%;padding:13px;border:1px solid var(--line);border-radius:13px;background:#0b1721;color:#fff;margin-top:9px}.link{color:#ff9a50;background:none;border:0;padding:5px}.msg{min-height:20px;color:#ffb6be;font-size:13px;margin-top:8px}.ok{color:#8cebc5}.row{display:flex;gap:9px}.row>*{flex:1}.loc{display:flex;gap:8px}.loc input{flex:1}.small{width:48px!important;padding:0!important}.vehicle{display:flex;gap:8px}.vehicle button{flex:1;padding:12px 4px;background:#0b1721;border:1px solid var(--line);border-radius:12px;color:#fff}.vehicle button.active{border-color:var(--orange);background:#291a10}.pay{display:flex;gap:8px}.pay button{flex:1;padding:12px;background:#0b1721;border:1px solid var(--line);border-radius:12px;color:#fff}.pay button.active{border-color:var(--orange)}
#map,#liveMap{height:280px;border-radius:16px;overflow:hidden;border:1px solid var(--line);margin:12px 0}.fare{display:flex;justify-content:space-between;padding:13px;background:#0b1721;border-radius:13px;margin:10px 0}.fare strong{font-size:20px}.status{display:flex;align-items:center;gap:8px;color:#9ff0cf}.dot{width:8px;height:8px;border-radius:50%;background:var(--green)}.driver{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center}.avatar{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:#263c50;font-size:23px}.actions{display:flex;gap:8px;margin-top:12px}.actions button{flex:1;padding:12px;border:0;border-radius:12px;color:#fff;font-weight:700}.call{background:#14a96f}.message{background:#177fd1}.cancel{width:100%;margin-top:9px;padding:13px;border:1px solid #8f3040;border-radius:12px;background:#32151c;color:#ffb4bd;font-weight:700}.hide{display:none!important}.error{color:#ff9eaa}.notice{font-size:12px;color:var(--muted);margin-top:8px}.logout{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:10px;padding:8px 10px}
html,body{
  margin:0;
  padding:0;
  min-height:100%;
}

.screen{
  width:100%;
}

#rideScreen,
#activeScreen,
#authScreen{
  margin-top:0;
}
</style>
</head>
<body>

<div class="app">

<header class="top">
<div class="logo"><b>R</b>YDO</div>
<div id="accountArea"></div>
</header>

<section id="welcomeScreen" class="screen active">
<div class="welcome-screen">
<div class="welcome-container">
<div class="welcome-branding">
<div class="welcome-logo"><b>R</b>YDO</div>
<div class="welcome-tagline">Move your way.</div>
</div>

<div class="role-buttons">
<button type="button" class="role-btn passenger-btn" id="passengerBtn">Passenger</button>
<button type="button" class="role-btn driver-btn" id="driverBtn">Driver</button>
</div>

</div>
</div>
</section>

<section id="authScreen" class="screen">

<div class="title">Move your way.</div>
<div class="sub">Create your passenger account or log in to request a real RYDO ride.</div>

<div class="tabs">
<button class="tab active" id="loginTab">Login</button>
<button class="tab" id="registerTab">Register</button>
</div>

<form id="authForm">

<div id="nameField" class="field hide">
<label>Full name</label>
<input id="fullName" autocomplete="name">
</div>

<div id="phoneField" class="field hide">
<label>Phone</label>
<input id="phone" autocomplete="tel" placeholder="+977...">
</div>

<div class="field">
<label>Email</label>
<input id="email" type="email" required autocomplete="email">
</div>

<div class="field">
<label>Password</label>
<input id="password" type="password" required minlength="6" autocomplete="current-password">
</div>

<button class="primary" id="authBtn">Login</button>

<button type="button" class="link" id="forgot">
Forgot password?
</button>

<div id="authMsg" class="msg"></div>

</form>
</div>
</section>

<section id="rideScreen" class="screen">

<div class="box">

<div class="title">Request a ride</div>
<div class="sub">Choose your pickup and destination. GPS can fill your current location.</div>

<div class="field">
<label>Pickup</label>
<div class="loc">
<input id="pickup" placeholder="Enter pickup address">
<button class="ghost small" type="button" id="gps">📍</button>
</div>
</div>

<div class="field destination-box">
<label>Destination</label>

<input
  id="destination"
  placeholder="Search place, area or landmark..."
  autocomplete="off"
>

<div id="destinationSuggestions" class="suggestions hide"></div>

<div id="destinationSelected" class="selected-place hide"></div>
</div>

<div id="routeMsg" class="notice"></div>

<div id="map"></div>

<div class="field">
<label>Vehicle</label>
<div class="vehicle">
<button data-v="bike" class="active">🏍️ Bike</button>
<button data-v="car">🚗 Car</button>
<button data-v="tuk_tuk">🛺 Tuk Tuk</button>
</div>
</div>

<div class="field">
<label>Payment</label>
<div class="pay">
<button data-p="cash" class="active">💵 Cash</button>
<button data-p="online">💳 Digital</button>
</div>
</div>

<div class="fare">
<span>Distance<br><strong id="distance">—</strong></span>
<span>ETA<br><strong id="eta">—</strong></span>
<span>Fare<br><strong id="fare">NPR 0</strong></span>
</div>

<button class="primary" id="request">
Request Ride
</button>

</div>
</section>

<section id="activeScreen" class="screen">

<div class="box">

<div class="status">
<span class="dot"></span>
<span id="rideStatus">Finding a driver...</span>
</div>

<div id="liveMap"></div>

<div class="driver">

<div class="avatar">👨</div>

<div>
<b id="driverName">Waiting for driver</b>
<div id="vehicleInfo" class="notice">Searching nearby...</div>
</div>

<div>
<b id="driverEta">—</b>
<div class="notice">to pickup</div>
</div>

</div>

<div class="actions">
<button class="call" id="call">📞 Call</button>
<button class="message" id="message">💬 Message</button>
</div>

<button class="cancel" id="cancel">
❌ Cancel Ride
</button>

<div id="activeMsg" class="notice"></div>

</div>
</section>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const SUPABASE_URL="https://kqtvuorasqyzjbnlkkxs.supabase.co";

const SUPABASE_KEY="sb_publishable_zZFJiy0YWZgOXFesVuAQcA_wd7rleMb";

const sb=window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let mode="login";
let vehicle="bike";
let payment="cash";
let pickupCoords=null;
let destCoords=null;
let route=null;
let ride=null;
let map=null;
let liveMap=null;
let rideChannel=null;

const $=id=>document.getElementById(id);

function show(id){
  document.querySelectorAll(".screen").forEach(x=>{
    x.classList.remove("active");
  });

  const screen=$(id);

  if(screen){
    screen.classList.add("active");
  }

  document.documentElement.scrollTop=0;
  document.body.scrollTop=0;

  setTimeout(()=>{
    window.scrollTo(0,0);
    document.documentElement.scrollTop=0;
    document.body.scrollTop=0;
  },50);
  }

  $(id).classList.add("active");

  window.scrollTo({
    top:0,
    left:0,
    behavior:"instant"
  });
  }

function msg(el,text,ok=false){
$(el).textContent=text;
$(el).className=ok?"msg ok":"msg";
}

function setAuthMode(m){

mode=m;

$("loginTab").classList.toggle("active",m==="login");
$("registerTab").classList.toggle("active",m==="register");

$("nameField").classList.toggle("hide",m!=="register");
$("phoneField").classList.toggle("hide",m!=="register");

$("authBtn").textContent=
m==="login"?"Login":"Create account";

$("forgot").classList.toggle("hide",m!=="login");

$("authMsg").textContent="";
}

function account(user){

$("accountArea").innerHTML=
'<button class="logout" id="logout">Logout</button>';

$("logout").onclick=async()=>{

await sb.auth.signOut();

show("authScreen");

$("accountArea").innerHTML="";
};
}

async function auth(e){

e.preventDefault();

msg("authMsg","");

const email=$("email").value.trim();
const password=$("password").value;

let r;

if(mode==="register"){

const full_name=$("fullName").value.trim();
const phone=$("phone").value.trim();

if(!full_name||!phone)
return msg(
"authMsg",
"Full name and phone are required."
);

r=await sb.auth.signUp({
email,
password,
options:{
data:{
full_name,
phone,
role:"passenger"
},
emailRedirectTo:location.href
}
});

if(r.error)
return msg("authMsg",r.error.message);

if(r.data.user){

const {error}=await sb
.from("profiles")
.upsert({
id:r.data.user.id,
full_name,
phone,
role:"passenger"
},{onConflict:"id"});

if(error)
return msg(
"authMsg",
"Account created, but profile setup failed: "+error.message
);
}

if(!r.data.session)
return msg(
"authMsg",
"Account created. Check your email to confirm, then log in.",
true
);

}else{

r=await sb.auth.signInWithPassword({
email,
password
});

if(r.error)
return msg("authMsg",r.error.message);
}

if(r.data.session){

account(r.data.user);

await enterRide();
}
}

async function enterRide(){

show("rideScreen");

initMap();

loadFareRule();
}

async function forgot(){

const email=$("email").value.trim();

if(!email)
return msg(
"authMsg",
"Enter your email first."
);

const {error}=await sb.auth.resetPasswordForEmail(
email,
{redirectTo:location.href}
);

msg(
"authMsg",
error
?error.message
:"If that account exists, a reset email has been sent.",
!error
);
}

function initMap(){

if(map)return;

map=L.map("map").setView(
[27.7172,85.3240],
13
);

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
maxZoom:19,
attribution:"© OpenStreetMap"
}
).addTo(map);
}

async function geocode(q){

const u=
"https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=np&q="
+encodeURIComponent(q);

const r=await fetch(
u,
{headers:{"Accept":"application/json"}}
);

const d=await r.json();

if(!d[0])
throw new Error("Location not found");

return {
lat:+d[0].lat,
lon:+d[0].lon,
label:d[0].display_name
};
}

async function routeCalc(){

const p=$("pickup").value.trim();
const d=$("destination").value.trim();

if(!p||!d)return;

$("routeMsg").textContent=
"Finding road route...";

try{

if(!pickupCoords||pickupCoords.query!==p){

pickupCoords=await geocode(p);
pickupCoords.query=p;
}

if(!destCoords||destCoords.query!==d){

destCoords=await geocode(d);
destCoords.query=d;
}

const u=
`https://router.project-osrm.org/route/v1/driving/${pickupCoords.lon},${pickupCoords.lat};${destCoords.lon},${destCoords.lat}?overview=full&geometries=geojson`;

const r=await fetch(u);
const j=await r.json();

if(j.code!=="Ok")
throw new Error("Route unavailable");

route=j.routes[0];

const km=route.distance/1000;
const mins=Math.ceil(route.duration/60);

$("distance").textContent=
km.toFixed(1)+" km";

$("eta").textContent=
mins+" min";

await calcFare(km);

map.eachLayer(x=>{
if(
x instanceof L.Polyline||
x instanceof L.Marker
)x.remove();
});

L.geoJSON(
route.geometry,
{style:{weight:5}}
).addTo(map);

L.marker([
pickupCoords.lat,
pickupCoords.lon
]).addTo(map)
.bindPopup("Pickup");

L.marker([
destCoords.lat,
destCoords.lon
]).addTo(map)
.bindPopup("Destination");

map.fitBounds(
[
[pickupCoords.lat,pickupCoords.lon],
[destCoords.lat,destCoords.lon]
],
{padding:[20,20]}
);

$("routeMsg").textContent=
"Road route calculated.";

}catch(e){

$("routeMsg").textContent=e.message;
}
}

async function loadFareRule(){

await calcFare(0);
}

async function calcFare(km){

const {
data,
error
}=await sb
.from("fare_rules")
.select("base_fare,per_km_fare")
.eq("vehicle_type",vehicle)
.eq("is_active",true)
.limit(1)
.maybeSingle();

if(error||!data){

$("fare").textContent="NPR —";

return;
}

const f=
Number(data.base_fare)+
(Number(data.per_km_fare)*Number(km||0));

$("fare").textContent=
"NPR "+
Math.round(f).toLocaleString();
}

async function gps(){

  if(!navigator.geolocation){
    $("routeMsg").textContent="GPS is not supported on this device.";
    return;
  }

  $("routeMsg").textContent="📍 Finding your exact location...";

  navigator.geolocation.getCurrentPosition(
    async p=>{

      const lat=p.coords.latitude;
      const lon=p.coords.longitude;
      const accuracy=Math.round(p.coords.accuracy);

      // Reject clearly inaccurate GPS positions
      if(!Number.isFinite(lat)||!Number.isFinite(lon)){
        $("routeMsg").textContent="Unable to get a valid GPS position.";
        return;
      }

      if(accuracy>100){
        $("routeMsg").textContent=
          "GPS accuracy is too low ("+accuracy+"m). Move to an open area and try again.";
        return;
      }

      pickupCoords={
        lat:lat,
        lon:lon,
        query:"__gps__",
        accuracy:accuracy
      };

      // Show exact GPS coordinates on the map
      map.setView([lat,lon],18);

      // Reverse geocode exact GPS position
      try{

        $("routeMsg").textContent=
          "📍 Location found. Getting address...";

        const u=
          "https://nominatim.openstreetmap.org/reverse"+
          "?format=json"+
          "&lat="+encodeURIComponent(lat)+
          "&lon="+encodeURIComponent(lon)+
          "&zoom=18"+
          "&addressdetails=1";

        const r=await fetch(u,{
          headers:{
            "Accept":"application/json"
          }
        });

        if(!r.ok)
          throw new Error("Address lookup failed.");

        const d=await r.json();

        const address=
          d.display_name||
          ("GPS location ("+lat.toFixed(6)+", "+lon.toFixed(6)+")");

        pickupCoords.label=address;

        // Put the actual detected address into pickup field
        $("pickup").value=address;

        // Remove old pickup/destination markers and route
        map.eachLayer(x=>{
          if(
            x instanceof L.Polyline||
            x instanceof L.Marker
          )x.remove();
        });

        // Exact passenger position marker
        L.marker([lat,lon])
          .addTo(map)
          .bindPopup(
            "📍 Your location<br>Accuracy: approximately "+
            accuracy+" meters"
          )
          .openPopup();

        $("routeMsg").textContent=
          "📍 Your location found • GPS accuracy ~"+accuracy+"m";

        // Calculate route if destination exists
        if($("destination").value.trim()){
          await routeCalc();
        }

      }catch(e){

        // GPS coordinates are still valid even if address lookup fails
        $("pickup").value=
          "GPS: "+lat.toFixed(6)+", "+lon.toFixed(6);

        $("routeMsg").textContent=
          "📍 GPS location found (~"+accuracy+
          "m accuracy), but address lookup failed.";

        if($("destination").value.trim()){
          await routeCalc();
        }
      }

    },

    error=>{

      let message="Unable to get your location.";

      if(error.code===1)
        message=
          "Location permission denied. Allow location access for Rydo.";

      else if(error.code===2)
        message=
          "Your location is unavailable. Turn on phone Location/GPS and try again.";

      else if(error.code===3)
        message=
          "GPS took too long. Move to an open area and try again.";

      $("routeMsg").textContent="📍 "+message;
    },

    {
      enableHighAccuracy:true,
      timeout:20000,
      maximumAge:0
    }
  );
  }

async function requestRide(){

const user=
(await sb.auth.getUser()).data.user;

if(!user)
return show("authScreen");

if(!pickupCoords)

try{

pickupCoords=
await geocode(
$("pickup").value.trim()
);

}catch(e){

return $("routeMsg").textContent=e.message;
}

if(!destCoords)

try{

destCoords=
await geocode(
$("destination").value.trim()
);

}catch(e){

return $("routeMsg").textContent=e.message;
}

if(!route)

return $("routeMsg").textContent=
"Enter both locations and wait for the route to calculate.";

const km=route.distance/1000;

const {
data:rule
}=await sb
.from("fare_rules")
.select(
"base_fare,per_km_fare,platform_commission_percent"
)
.eq("vehicle_type",vehicle)
.eq("is_active",true)
.limit(1)
.maybeSingle();

if(!rule)

return $("routeMsg").textContent=
"Fare rule is not configured.";

const fare=Math.round(
Number(rule.base_fare)+
Number(rule.per_km_fare)*km
);

const commission=
fare*
Number(rule.platform_commission_percent||0)/
100;

const {
data,
error
}=await sb
.from("rides")
.insert({

passenger_id:user.id,

pickup_location:
$("pickup").value.trim(),

destination:
$("destination").value.trim(),

vehicle_type:vehicle,

distance_km:km,

fare:fare,

status:"requested",

driver_earnings:
fare-commission,

admin_earnings:
commission,

pickup_latitude:
pickupCoords.lat,

pickup_longitude:
pickupCoords.lon,

destination_latitude:
destCoords.lat,

destination_longitude:
destCoords.lon

})
.select()
.single();

if(error)
return $("routeMsg").textContent=
error.message;

ride=data;

openActive();

subscribeRide();
}

function openActive(){

show("activeScreen");

$("rideStatus").textContent=
"Finding a driver...";

initLiveMap();
}

function initLiveMap(){

if(liveMap)return;

liveMap=L.map("liveMap")
.setView(
[27.7172,85.324],
13
);

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
maxZoom:19,
attribution:"© OpenStreetMap"
}
).addTo(liveMap);

if(pickupCoords)

liveMap.setView(
[
pickupCoords.lat,
pickupCoords.lon
],
15
);
}

function subscribeRide(){

if(rideChannel)
sb.removeChannel(rideChannel);

rideChannel=
sb.channel("ride-"+ride.id)
.on(
"postgres_changes",
{
event:"UPDATE",
schema:"public",
table:"rides",
filter:"id=eq."+ride.id
},
payload=>{

ride=payload.new;

renderRide();
}
)
.subscribe();

renderRide();
}

function renderRide(){

if(!ride)return;

$("rideStatus").textContent=
(ride.status||"requested")
.replaceAll("_"," ");

if(ride.driver_id){

$("driverName").textContent=
"Driver assigned";

$("vehicleInfo").textContent=
(ride.vehicle_type||"Vehicle")+
" • Driver location updating";
}

$("driverEta").textContent=
ride.current_latitude&&
ride.current_longitude
?"Live":"—";

if(
ride.current_latitude&&
ride.current_longitude
){

if(!window.driverMarker)

window.driverMarker=
L.marker([
ride.current_latitude,
ride.current_longitude
]).addTo(liveMap);

else

window.driverMarker.setLatLng([
ride.current_latitude,
ride.current_longitude
]);

liveMap.setView(
[
ride.current_latitude,
ride.current_longitude
],
15
);
}
}

async function cancelRide(){

if(!ride)return;

const {
error
}=await sb
.from("rides")
.update({
status:"cancelled"
})
.eq("id",ride.id)
.eq(
"passenger_id",
(await sb.auth.getUser()).data.user.id
);

$("activeMsg").textContent=
error
?error.message
:"Ride cancelled.";

if(!error){

setTimeout(
()=>{
show("rideScreen");
ride=null;
},
700
);
}
}

$("loginTab").onclick=
()=>setAuthMode("login");

$("registerTab").onclick=
()=>setAuthMode("register");

$("authForm").onsubmit=auth;

$("forgot").onclick=forgot;

$("gps").onclick=gps;

$("pickup").onchange=routeCalc;

$("destination").onchange=routeCalc;

$("request").onclick=requestRide;

$("cancel").onclick=cancelRide;

document.querySelectorAll("[data-v]")
.forEach(
b=>b.onclick=()=>{

vehicle=b.dataset.v;

document.querySelectorAll("[data-v]")
.forEach(
x=>x.classList.toggle(
"active",
x===b
)
);

if(route)
calcFare(
route.distance/1000
);
}
);

document.querySelectorAll("[data-p]")
.forEach(
b=>b.onclick=()=>{

payment=b.dataset.p;

document.querySelectorAll("[data-p]")
.forEach(
x=>x.classList.toggle(
"active",
x===b
)
);

);
