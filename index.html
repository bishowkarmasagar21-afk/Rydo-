<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#08111b">
<title>RRYD — Move Your Way</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  min-height: 100%;
  background: #08111b;
}

body {
  min-height: 100vh;
  background: #08111b;
  color: white;
  font-family: Arial, Helvetica, sans-serif;
}

.poster {
  position: relative;
  width: 100%;
  max-width: 1648px;
  margin: 0 auto;
  line-height: 0;
  overflow: hidden;
  background: #08111b;
}

.poster img {
  display: block;
  width: 100%;
  height: auto;
}

/* Real clickable areas positioned over the buttons in the image */
.role-link {
  position: absolute;
  top: 59.2%;
  height: 9.5%;
  display: block;
  border-radius: 100px;
  text-decoration: none;
  line-height: normal;
  background: transparent;
  transition: background .2s, box-shadow .2s;
}

.passenger-link {
  left: 27.6%;
  width: 21.9%;
}

.driver-link {
  left: 50.9%;
  width: 21.5%;
}

.role-link:hover {
  background: rgba(255,255,255,.09);
  box-shadow: 0 0 0 2px rgba(255,116,23,.8);
}

.role-link:focus-visible {
  outline: 4px solid white;
  outline-offset: 3px;
}

/* Small accessible help button */
.settings-button {
  position: fixed;
  z-index: 10;
  top: 14px;
  right: 14px;
  width: 42px;
  height: 42px;
  border: 1px solid rgba(255,255,255,.35);
  border-radius: 50%;
  background: rgba(8,17,27,.8);
  color: white;
  font-size: 21px;
  cursor: pointer;
  backdrop-filter: blur(8px);
}

.settings-button:hover {
  background: #ff7417;
  color: #08111b;
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 20;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(0,0,0,.75);
}

.modal.show {
  display: flex;
}

.dialog {
  width: 100%;
  max-width: 360px;
  padding: 25px;
  border: 1px solid rgba(255,116,23,.5);
  border-radius: 18px;
  background: #101d29;
  line-height: 1.5;
}

.dialog h2 {
  margin-bottom: 10px;
}

.dialog p {
  color: #c1ccd7;
  font-size: 14px;
  margin-bottom: 20px;
}

.close-button {
  width: 100%;
  padding: 13px;
  border: 0;
  border-radius: 10px;
  background: #ff7417;
  color: #08111b;
  font-weight: bold;
  cursor: pointer;
}

footer {
  padding: 16px;
  text-align: center;
  color: #aab8c8;
  font-size: 12px;
  line-height: 1.5;
  background: #08111b;
}

@media (max-width: 600px) {
  .settings-button {
    width: 36px;
    height: 36px;
    top: 8px;
    right: 8px;
    font-size: 18px;
  }

  .role-link {
    top: 59.2%;
    height: 9.5%;
  }

  footer {
    font-size: 11px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .role-link {
    transition: none;
  }
}
</style>
</head>

<body>

<main>
  <section class="poster" aria-label="RRYD Nepal ride platform">
    <img
      src="nepal-hero.png"
      alt="RRYD Nepal: Mount Everest and the Himalayas, green hills, and the Terai plains at sunset."
      fetchpriority="high"
    >

    <a
      class="role-link passenger-link"
      href="passenger.html"
      aria-label="Book a ride as a passenger"
      title="Book a Ride"
    ></a>

    <a
      class="role-link driver-link"
      href="driver.html"
      aria-label="Become a driver"
      title="Become a Driver"
    ></a>
  </section>
</main>

<footer>
  © 2026 RRYD · Move your way.
</footer>

<button
  class="settings-button"
  id="settingsButton"
  type="button"
  aria-label="Open website settings"
  title="Settings"
>⚙</button>

<div
  class="modal"
  id="settingsModal"
  role="dialog"
  aria-modal="true"
  aria-labelledby="settingsTitle"
>
  <div class="dialog">
    <h2 id="settingsTitle">RRYD Settings</h2>
    <p>
      Nepal's ride platform.<br>
      Choose Book a Ride to continue as a passenger,
      or Become a Driver to open the driver portal.
    </p>
    <button class="close-button" id="closeSettings" type="button">
      Close
    </button>
  </div>
</div>

<script>
const settingsButton = document.getElementById("settingsButton");
const settingsModal = document.getElementById("settingsModal");
const closeSettings = document.getElementById("closeSettings");

function openSettings() {
  settingsModal.classList.add("show");
  closeSettings.focus();
}

function hideSettings() {
  settingsModal.classList.remove("show");
  settingsButton.focus();
}

settingsButton.addEventListener("click", openSettings);
closeSettings.addEventListener("click", hideSettings);

settingsModal.addEventListener("click", function(event) {
  if (event.target === settingsModal) {
    hideSettings();
  }
});

document.addEventListener("keydown", function(event) {
  if (event.key === "Escape" && settingsModal.classList.contains("show")) {
    hideSettings();
  }
});
</script>

</body>
</html>
```
