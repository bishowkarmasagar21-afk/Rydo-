<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RYDO Passenger</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<main class="home">

  <div class="logo">
    <span>R</span>YDO
  </div>

  <p class="tagline">Passenger</p>

  <div class="home-card">

    <h1>Welcome</h1>

    <p class="sub">
      Login or create your RYDO passenger account.
    </p>

    <form id="loginForm">

      <input
        id="email"
        type="email"
        placeholder="Email address"
        required
      >

      <input
        id="password"
        type="password"
        placeholder="Password"
        required
      >

      <button class="home-btn" type="submit">
        Login
      </button>

    </form>

    <a class="home-btn" href="#">
      Create Account
    </a>

    <div class="login-box">
      <a href="index.html">← Back to RYDO</a>
    </div>

  </div>

</main>

<script src="passenger.js"></script>

</body>
</html>
