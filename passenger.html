<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RideGo - Passenger</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      color: #00d084;
    }

    .profile {
      background: #374151;
      padding: 8px 14px;
      border-radius: 20px;
    }

    .container {
      max-width: 500px;
      margin: 30px auto;
      padding: 15px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .card h2 {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
    }

    .location {
      position: relative;
    }

    .location::before {
      content: "📍";
      position: absolute;
      right: 12px;
      top: 12px;
    }

    .vehicles {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 10px;
    }

    .vehicle {
      border: 2px solid #ddd;
      padding: 15px 5px;
      text-align: center;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.2s;
    }

    .vehicle:hover,
    .vehicle.active {
      border-color: #00d084;
      background: #eafff5;
    }

    .vehicle .icon {
      font-size: 30px;
    }

    .vehicle p {
      margin-top: 5px;
      font-weight: bold;
    }

    .fare {
      margin-top: 20px;
      padding: 15px;
      background: #f3f4f6;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
    }

    .fare strong {
      color: #00a86b;
      font-size: 20px;
    }

    .request-btn {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #00d084;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .request-btn:hover {
      background: #00b871;
    }

    #status {
      text-align: center;
      margin-top: 15px;
      color: #555;
    }

    @media (max-width: 500px) {
      .container {
        margin: 10px auto;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>RideGo</h1>
    <div class="profile">👤 Passenger</div>
  </header>

  <main class="container">

    <div class="card">

      <h2>Where are you going?</h2>

      <label>Pickup Location</label>
      <div class="location">
        <input
          type="text"
          id="pickup"
          placeholder="Enter pickup location">
      </div>

      <label>Destination</label>
      <div class="location">
        <input
          type="text"
          id="destination"
          placeholder="Where to?">
      </div>

      <label>Select Ride</label>

      <div class="vehicles">

        <div class="vehicle active" onclick="selectVehicle(this, 'Bike')">
          <div class="icon">🏍️</div>
          <p>Bike</p>
        </div>

        <div class="vehicle" onclick="selectVehicle(this, 'Car')">
          <div class="icon">🚗</div>
          <p>Car</p>
        </div>

        <div class="vehicle" onclick="selectVehicle(this, 'SUV')">
          <div class="icon">🚙</div>
          <p>SUV</p>
        </div>

      </div>

      <div class="fare">
        <span>Estimated Fare</span>
        <strong id="fare">Rs. 250</strong>
      </div>

      <button class="request-btn" onclick="requestRide()">
        Request Ride
      </button>

      <div id="status"></div>

    </div>

  </main>

  <script>

    let selectedVehicle = "Bike";

    function selectVehicle(element, vehicle) {

      document.querySelectorAll(".vehicle").forEach(item => {
        item.classList.remove("active");
      });

      element.classList.add("active");

      selectedVehicle = vehicle;

      // Example fare calculation
      const fares = {
        Bike: 180,
        Car: 250,
        SUV: 400
      };

      document.getElementById("fare").innerText =
        "Rs. " + fares[vehicle];
    }

    function requestRide() {

      const pickup = document.getElementById("pickup").value;
      const destination = document.getElementById("destination").value;
      const status = document.getElementById("status");

      if (!pickup || !destination) {
        status.innerText =
          "Please enter pickup and destination.";
        status.style.color = "red";
        return;
      }

      status.style.color = "#00a86b";

      status.innerText =
        "🔍 Finding a " + selectedVehicle + " driver...";

      // Simulate driver searching
      setTimeout(() => {
        status.innerText =
          "🚗 Driver found! Your driver is on the way.";
      }, 3000);
    }

  </script>

</body>
</html>
