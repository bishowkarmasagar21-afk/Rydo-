
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rydo Passenger</title>
<link href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#08111b;--panel:#142638;--orange:#ff7417;--text:#f4f7fb;--muted:#aab9c9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px Arial,sans-serif}
header{padding:18px;background:#101d29;border-bottom:1px solid #2b3c4d;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:25px;font-weight:900}.logo b{color:var(--orange)}main{max-width:850px;margin:auto;padding:16px}
.card{background:var(--panel);padding:18px;border-radius:16px;margin:14px 0;border:1px solid #2a4053}
h2{margin-top:0}input,select,button{width:100%;padding:13px;margin:6px 0;border-radius:9px;font-size:16px}
input,select{background:#fff;color:#17304a;border:2px solid var(--orange)}
button{background:var(--orange);color:#171717;border:0;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}button.secondary{background:#d8edff}button.danger{background:#ff5366;color:#fff}
.small{font-size:13px;color:var(--muted)}.hidden{display:none!important}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
#map{height:300px;border-radius:12px;overflow:hidden;margin:10px 0}
#message{padding:12px;border-radius:9px;background:#203548;white-space:pre-wrap;overflow-wrap:anywhere}
#message:empty{display:none}.price{font-size:25px;font-weight:bold;color:#ffb27d}
@media(max-width:500px){main{padding:10px}.card{padding:14px}.row{gap:5px}#map{height:260px}}
</style>
</head>
<body>
<header><div class="logo"><b>R</b>YDO</div><span>Move your way.</span></header>
<main>
<div id="message" role="status"></div>

<section id="auth">
 <div class="card">
  <h2>Passenger account</h2>
  <p class="small">Use your Nepal mobile number and verify by SMS code.</p>
  <label for="mode">Choose an option</label>
  <select id="mode">
   <option value="register">Create account</option>
   <option value="login">Log in</option>
  </select>
  <div id="nameWrap">
   <label for="fullName">Full name</label>
   <input id="fullName" autocomplete="name" placeholder="Your full name">
  </div>
  <label for="phone">Mobile number</label>
  <input id="phone" type="tel" autocomplete="tel" placeholder="98XXXXXXXX" required>
  <button id="sendBtn" type="button">Send SMS OTP</button>
  <div id="otpWrap" class="hidden">
   <label for="otp">SMS verification code</label>
   <input id="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="Enter code">
   <button id="verifyBtn" type="button">Verify code and continue</button>
  </div>
 </div>
</section>

<section id="app" class="hidden">
 <div class="card">
  <div class="row"><div><h2>Book a ride</h2><span id="welcome" class="small"></span></div>
  <button id="logoutBtn" class="secondary" type="button">Log out</button></div>
  <label for="pickup">Pickup location</label>
  <input id="pickup" placeholder="Enter pickup place">
  <div class="row"><button id="gpsBtn" type="button">Use my GPS</button><button id="pickupSearch" class="secondary" type="button">Find pickup</button></div>
  <label for="destination">Destination</label>
  <input id="destination" placeholder="Hospital, bus park, landmark, address...">
  <button id="destinationSearch" class="secondary" type="button">Find destination</button>
  <div id="map"></div>
  <label for="vehicle">Vehicle</label>
  <select id="vehicle"><option value="bike">Bike</option><option value="car">Car</option><option value="tuk_tuk">Tuk Tuk</option></select>
  <label for="payment">Payment method</label>
  <select id="payment"><option value="cash">Cash</option><option value="online">Online</option></select>
  <button id="routeBtn" type="button">Calculate route and fare</button>
  <p>Distance: <b id="distance">—</b></p>
  <p>Estimated trip time: <b id="eta">—</b></p>
  <p>Estimated fare</p><div id="fare" class="price">—</div>
  <button id="requestBtn" type="button">Request ride</button>
 </div>
 <div class="card">
  <h2>My current ride</h2><p id="rideInfo">No ride requested yet.</p>
  <button id="cancelBtn" class="danger" type="button">Cancel requested ride</button>
 </div>
 <div class="card">
  <h2>Account settings</h2>
  <p class="small">Deleting your account is permanent and cannot be undone.</p>
  <button id="deleteBtn" class="danger" type="button">Delete my account</button>
 </div>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>
<script>
const SUPABASE_URL="https://kqtvuorasqyzjbnlkkxs.supabase.co";
const SUPABASE_KEY="sb_publishable_0YO71GOwynEf3ithOtFfxg_z6YL-LKG";
const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const $=id=>document.getElementById(id);
let pendingPhone="",pendingName="",map=null,pickCoords=null,destCoords=null;
let routeKm=null,routeSeconds=null,routeGeo=null,currentRide=null,fareValue=null;
let fareRules={};

function msg(s){$("message").textContent=s||""}
function busy(id,on){$(id).disabled=on}
function phoneFormat(raw){
 let n=raw.trim().replace(/[^\d+]/g,"");
 if(n.startsWith("+"))return n;
 n=n.replace(/\D/g,"");
 if(n.startsWith("977"))return "+"+n;
 if(n.startsWith("0"))n=n.slice(1);
 return "+977"+n;
}
$("mode").onchange=()=>{
 $("nameWrap").classList.toggle("hidden",$("mode").value!=="register");
 $("otpWrap").classList.add("hidden");msg("");
};
async function sendOtp(){
 msg("");
 const mode=$("mode").value;
 pendingPhone=phoneFormat($("phone").value);
 pendingName=$("fullName").value.trim();
 if(!/^\+\d{8,15}$/.test(pendingPhone))return msg("Enter a valid mobile number with country code, for example +97798XXXXXXXX.");
 if(mode==="register"&&!pendingName)return msg("Enter your full name first.");
 busy("sendBtn",true);
 try{
  const {error}=await supabase.auth.signInWithOtp({
   phone:pendingPhone,
   options:{
    shouldCreateUser:mode==="register",
    data:mode==="register"?{full_name:pendingName,role:"passenger"}:undefined
   }
  });
  if(error)throw error;
  $("otpWrap").classList.remove("hidden");
  msg("OTP requested. Check your SMS and enter the code. If you just requested a code, wait before requesting another.");
 }catch(e){msg("Could not send OTP: "+e.message)}
 finally{busy("sendBtn",false)}
}
async function verifyOtp(){
 msg("");const token=$("otp").value.trim();
 if(!token)return msg("Enter the SMS code.");
 busy("verifyBtn",true);
 try{
  const {data,error}=await supabase.auth.verifyOtp({phone:pendingPhone,token,type:"sms"});
  if(error)throw error;
  const user=data.user;
  if(!user)throw new Error("OTP was accepted but no user session was returned.");
  const fullName=pendingName||user.user_metadata?.full_name||"Rydo Passenger";

  // The Auth trigger creates the profile. This fallback insert runs only
  // after verified login, and only for the current user's own id.
  let {data:profile,error:profileError}=await supabase.from("profiles")
    .select("id,full_name,role,is_verified").eq("id",user.id).maybeSingle();
  if(profileError)throw new Error("Profile lookup failed: "+profileError.message);
  if(!profile){
   const {error:insertError}=await supabase.from("profiles").insert({
    id:user.id,full_name:fullName,phone:user.phone||pendingPhone,
    role:"passenger",is_verified:true,is_online:false
   });
   if(insertError)throw new Error("Profile setup failed. Check the trigger and RLS SQL from Step 1: "+insertError.message);
  }
  const {data:check,error:checkError}=await supabase.from("profiles")
    .select("id,full_name,role").eq("id",user.id).maybeSingle();
  if(checkError)throw checkError;
  if(!check)throw new Error("No passenger profile was found after OTP verification. Check the profile trigger.");
  if(check.role!=="passenger")throw new Error("This account is not registered as a passenger.");
  $("auth").classList.add("hidden");$("app").classList.remove("hidden");
  $("welcome").textContent="Signed in as "+(check.full_name||pendingPhone);
  await loadFareRules();initMap();msg("Login successful.");
 }catch(e){msg("Login/profile error: "+e.message)}
 finally{busy("verifyBtn",false)}
}
$("sendBtn").onclick=sendOtp;
$("verifyBtn").onclick=verifyOtp;

function initMap(){
 if(map)return;
 map=new maplibregl.Map({
  container:"map",style:"https://tiles.openfreemap.org/styles/liberty",
  center:[85.324,27.7172],zoom:12
 });
 map.addControl(new maplibregl.NavigationControl(),"top-right");
}
function mark(coords,color){
 if(!map||!coords)return;
 new maplibregl.Marker({color}).setLngLat(coords).addTo(map);
}
async function geocode(text){
 const url="https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=np&q="+encodeURIComponent(text);
 const r=await fetch(url);if(!r.ok)throw new Error("Place search is temporarily unavailable.");
 const data=await r.json();if(!data.length)throw new Error("No matching place found. Try a more specific Nepal address.");
 return {coords:[Number(data[0].lon),Number(data[0].lat)],label:data[0].display_name};
}
async function findPlace(which){
 const field=which==="pickup"?"pickup":"destination",button=which==="pickup"?"pickupSearch":"destinationSearch";
 busy(button,true);
 try{
  const p=await geocode($(field).value);$(field).value=p.label;
  if(which==="pickup")pickCoords=p.coords;else destCoords=p.coords;
  initMap();map.flyTo({center:p.coords,zoom:15});mark(p.coords,which==="pickup"?"#ff7417":"#168bff");
  msg(which==="pickup"?"Pickup found.":"Destination found.");
 }catch(e){msg(e.message)}finally{busy(button,false)}
}
$("pickupSearch").onclick=()=>findPlace("pickup");
$("destinationSearch").onclick=()=>findPlace("destination");
$("gpsBtn").onclick=()=>{
 if(!navigator.geolocation)return msg("GPS is not available on this device.");
 msg("Getting your location...");
 navigator.geolocation.getCurrentPosition(async pos=>{
  pickCoords=[pos.coords.longitude,pos.coords.latitude];
  try{
   const r=await fetch("https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat="+pickCoords[1]+"&lon="+pickCoords[0]);
   const d=await r.json();$("pickup").value=d.display_name||"My current location";
  }catch{$("pickup").value="My current location"}
  initMap();map.flyTo({center:pickCoords,zoom:16});mark(pickCoords,"#ff7417");
  msg("GPS pickup set. Check the location before requesting.");
 },e=>msg("Could not get GPS location: "+e.message),{enableHighAccuracy:true,timeout:15000});
};
async function loadFareRules(){
 const {data,error}=await supabase.from("fare_rules")
 .select("vehicle_type,base_fare,per_km_fare,is_active").eq("is_active",true);
 if(error){msg("Could not load fare rules: "+error.message);return}
 fareRules={};(data||[]).forEach(x=>fareRules[x.vehicle_type]=x);
}
async function calculateRoute(){
 msg("");
 if(!pickCoords)await findPlace("pickup");
 if(!destCoords)await findPlace("destination");
 if(!pickCoords||!destCoords)return;
 busy("routeBtn",true);
 try{
  const url=`https://router.project-osrm.org/route/v1/driving/${pickCoords[0]},${pickCoords[1]};${destCoords[0]},${destCoords[1]}?overview=full&geometries=geojson`;
  const r=await fetch(url);const d=await r.json();
  if(!d.routes?.length)throw new Error("No driving route found between these locations.");
  routeKm=d.routes[0].distance/1000;routeSeconds=d.routes[0].duration;
  routeGeo=d.routes[0].geometry;
  $("distance").textContent=routeKm.toFixed(1)+" km";
  $("eta").textContent=Math.max(1,Math.round(routeSeconds/60))+" min (estimate)";
  const v=$("vehicle").value,rule=fareRules[v];
  if(!rule)throw new Error("No active fare rule for "+v+". Check fare_rules in Supabase.");
  fareValue=Math.round(Number(rule.base_fare)+Number(rule.per_km_fare)*routeKm);
  $("fare").textContent="NPR "+fareValue;
  initMap();
  if(map.getSource("route")){map.removeLayer("route-line");map.removeSource("route")}
  map.addSource("route",{type:"geojson",data:{type:"Feature",properties:{},geometry:routeGeo}});
  map.addLayer({id:"route-line",type:"line",source:"route",paint:{"line-color":"#ff7417","line-width":5}});
  const b=new maplibregl.LngLatBounds();routeGeo.coordinates.forEach(c=>b.extend(c));map.fitBounds(b,{padding:35});
  msg("Route calculated. Fare is an estimate based on the mapped driving distance and your active fare rule.");
 }catch(e){msg("Route/fare error: "+e.message)}
 finally{busy("routeBtn",false)}
}
$("routeBtn").onclick=calculateRoute;
$("vehicle").onchange=()=>{if(routeKm!==null){const r=fareRules[$("vehicle").value];fareValue=r?Math.round(Number(r.base_fare)+Number(r.per_km_fare)*routeKm):null;$("fare").textContent=fareValue===null?"No fare rule":"NPR "+fareValue}};
$("requestBtn").onclick=async()=>{
 msg("");
 const {data:{user}}=await supabase.auth.getUser();
 if(!user)return msg("Please log in again.");
 if(!pickCoords||!destCoords||routeKm===null||fareValue===null)return msg("Find both places and calculate the route/fare first.");
 busy("requestBtn",true);
 try{
  const {data,error}=await supabase.from("rides").insert({
   passenger_id:user.id,pickup:$("pickup").value,destination:$("destination").value,
   vehicle_type:$("vehicle").value,distance_km:Number(routeKm.toFixed(2)),
   fare:fareValue,payment_method:$("payment").value,status:"requested",
   pickup_lat:pickCoords[1],pickup_lon:pickCoords[0],
   destination_lat:destCoords[1],destination_lon:destCoords[0]
  }).select("id,status,fare").single();
  if(error)throw error;
  currentRide=data;$("rideInfo").textContent="Ride requested. Status: "+data.status+" | Fare: NPR "+data.fare;
  msg("Ride request submitted. A driver must accept it before your trip can begin.");
 }catch(e){msg("Ride request failed: "+e.message)}
 finally{busy("requestBtn",false)}
};
$("cancelBtn").onclick=async()=>{
 if(!currentRide)return msg("There is no ride request from this session to cancel.");
 if(!confirm("Cancel this ride request?"))return;
 try{
  const {data:{user}}=await supabase.auth.getUser();
  const {error}=await supabase.from("rides").update({status:"cancelled"})
    .eq("id",currentRide.id).eq("passenger_id",user.id).eq("status","requested");
  if(error)throw error;
  currentRide=null;$("rideInfo").textContent="Ride cancelled or no longer cancellable.";
  msg("Cancellation submitted.");
 }catch(e){msg("Could not cancel ride: "+e.message)}
};
$("logoutBtn").onclick=async()=>{
 const {error}=await supabase.auth.signOut();
 if(error)return msg(error.message);
 location.reload();
};
$("deleteBtn").onclick=async()=>{
 if(!confirm("Permanently delete your Rydo account? This cannot be undone."))return;
 if(!confirm("Confirm permanent account deletion?"))return;
 try{
  const {data:{user}}=await supabase.auth.getUser();
  if(!user)throw new Error("Please log in again.");
  const {error}=await supabase.rpc("delete_own_account");
  if(error)throw error;
  await supabase.auth.signOut();
  alert("Your account deletion request completed.");
  location.reload();
 }catch(e){msg("Account deletion failed: "+e.message)}
};
(async()=>{
 const {data:{session}}=await supabase.auth.getSession();
 if(session?.user){
  const {data:p}=await supabase.from("profiles").select("id,full_name,role").eq("id",session.user.id).maybeSingle();
  if(p?.role==="passenger"){
   $("auth").classList.add("hidden");$("app").classList.remove("hidden");
   $("welcome").textContent="Signed in as "+(p.full_name||session.user.phone||"Passenger");
   await loadFareRules();initMap();
  }
 }
})();
</script>
</body>
</html>
