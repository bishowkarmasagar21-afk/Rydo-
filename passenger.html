<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width,initial-scale=1">

<title>RYDO Ride</title>

<link rel="stylesheet"
 href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<link rel="stylesheet" href="style.css">

<style>
#map{
 width:100%;
 height:280px;
 min-height:280px;
 margin:18px 0;
 border-radius:14px;
 overflow:hidden;
 border:1px solid #444;
 display:block;
}

.leaflet-container{
 width:100%;
 height:100%;
}

#placeResults{
 width:100%;
 margin-top:5px;
 background:#111;
 border:1px solid #ffad5c;
 border-radius:12px;
 overflow:hidden;
 position:relative;
 z-index:1000;
}

.place-item{
 width:100%;
 display:block;
 padding:12px;
 text-align:left;
 background:#111;
 color:#fff;
 border:0;
 border-bottom:1px solid #333;
 cursor:pointer;
}

.place-item b{
 color:#ffad5c;
}

.place-item small{
 display:block;
 margin-top:4px;
 color:#aaa;
 line-height:1.3;
}

#rideStatus{
 margin-top:12px;
 padding:12px;
 background:#191919;
 border:1px solid #ffad5c;
 border-radius:10px;
 color:#ffad5c;
 text-align:center;
}
</style>

</head>

<body>

<main class="home">

<div class="logo">
 <span>R</span>YDO
</div>

<p class="tagline">
 Book your ride
</p>

<div class="home-card">

<h1>
 Where are you going?
</h1>

<!-- MAP -->

<div id="map"></div>


<!-- GPS -->

<button
 class="location-btn"
 id="gps"
 type="button">

📍 Use my current location

</button>


<!-- PICKUP -->

<input
 id="pickup"
 type="text"
 placeholder="Pickup location">


<!-- DESTINATION -->

<input
 id="destination"
 type="text"
 placeholder="Search any destination in Nepal">


<!-- VEHICLES -->

<h2>
 Choose vehicle
</h2>

<div class="vehicles">

<button
 class="vehicle active"
 data-type="Bike"
 type="button">

🏍️ Bike

</button>

<button
 class="vehicle"
 data-type="Car"
 type="button">

🚗 Car

</button>

<button
 class="vehicle"
 data-type="Tuk Tuk"
 type="button">

🛺 Tuk Tuk

</button>

</div>


<!-- FARE -->

<div class="fare">

Estimated fare:

<strong id="fare">
--
</strong>

</div>


<!-- REQUEST -->

<button
 class="home-btn"
 id="request"
 type="button">

Request Ride

</button>


<!-- CANCEL -->

<button
 class="cancel-btn"
 id="cancel"
 type="button">

Cancel

</button>


<a
 class="back-link"
 href="index.html">

← Back

</a>

</div>

</main>


<script
 src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

<script src="passenger-ride.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="passenger-fare.js"></script>
<script src="passenger-ride.js"></script>
</body>
</html>
